<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Questões que a jurimetria pode responder</title>
  <desc id="desc">Três exemplos de perguntas jurimétricas sobre taxa de vitória, valores de indenização e tempo para apreciação de liminar.</desc>
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071739" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1600" height="720" rx="28" fill="#F8F5EF"/>
  <rect x="0" y="0" width="18" height="720" rx="9" fill="#071739"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g filter="url(#s)"><rect x="72" y="54" width="1456" height="170" rx="24" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="2"/><rect x="72" y="54" width="16" height="170" rx="8" fill="#071739"/><circle cx="155" cy="139" r="38" fill="#071739"/><text x="155" y="151" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">1</text><text x="235" y="126" font-size="34" font-weight="650" fill="#172033"><tspan x="235" dy="0">Qual é a taxa de vitória do Ministério Público</tspan><tspan x="235" dy="46">nas ações ambientais no TJSP?</tspan></text></g>
    <g filter="url(#s)"><rect x="72" y="275" width="1456" height="170" rx="24" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="2"/><rect x="72" y="275" width="16" height="170" rx="8" fill="#4B6382"/><circle cx="155" cy="360" r="38" fill="#4B6382"/><text x="155" y="372" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">2</text><text x="235" y="347" font-size="34" font-weight="650" fill="#172033"><tspan x="235" dy="0">Qual é a diferença entre o valor arbitrado e o valor da ação</tspan><tspan x="235" dy="46">nos processos por dano moral?</tspan></text></g>
    <g filter="url(#s)"><rect x="72" y="496" width="1456" height="170" rx="24" fill="#FFFFFF" stroke="#CDD5DB" stroke-width="2"/><rect x="72" y="496" width="16" height="170" rx="8" fill="#A68868"/><circle cx="155" cy="581" r="38" fill="#A68868"/><text x="155" y="593" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">3</text><text x="235" y="568" font-size="34" font-weight="650" fill="#172033"><tspan x="235" dy="0">Quanto tempo decorre entre o pedido de liminar</tspan><tspan x="235" dy="46">e sua apreciação?</tspan></text></g>
  </g>
</svg>
