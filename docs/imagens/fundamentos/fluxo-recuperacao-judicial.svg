<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo simplificado da recuperação judicial</title>
  <desc id="desc">Fluxograma do pedido inicial às decisões de extinção, homologação, falência ou cram down.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 11 6 1 11z" fill="#4B6382"/></marker><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#071739" flood-opacity=".10"/></filter></defs>
  <rect width="1800" height="980" rx="28" fill="#F8F5EF"/>
  <text x="70" y="64" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="#071739">Fluxo simplificado da recuperação judicial</text>
  <line x1="70" y1="92" x2="690" y2="92" stroke="#A68868" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="55" y="395" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#071739" stroke-width="3"/><text x="150" y="445" font-size="26" font-weight="700" fill="#071739">Pedido de</text><text x="150" y="480" font-size="26" font-weight="700" fill="#071739">recuperação judicial</text></g>
    <path d="M245 455H330" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/>
    <polygon points="410,350 515,455 410,560 305,455" fill="#E7EBEF" stroke="#4B6382" stroke-width="3"/><text x="410" y="465" font-size="28" font-weight="700" fill="#071739">Defere?</text>
    <path d="M410 350V235H410" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="445" y="305" font-size="23" font-weight="650" fill="#4B6382">Não</text>
    <g filter="url(#s)"><rect x="300" y="130" width="220" height="105" rx="18" fill="#FFFFFF" stroke="#A68868" stroke-width="3"/><text x="410" y="175" font-size="25" font-weight="700" fill="#071739">Sentença:</text><text x="410" y="208" font-size="25" fill="#172033">extingue o processo</text></g>
    <path d="M515 455H590" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="550" y="430" font-size="23" font-weight="650" fill="#4B6382">Sim</text>
    <g filter="url(#s)"><rect x="600" y="385" width="210" height="140" rx="18" fill="#071739"/><text x="705" y="430" font-size="25" font-weight="700" fill="#FFFFFF">Nomeia o AJ</text><text x="705" y="467" font-size="23" fill="#FFFFFF">e inicia o</text><text x="705" y="500" font-size="23" fill="#FFFFFF">stay period</text></g>
    <path d="M810 455H875" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/>
    <g filter="url(#s)"><rect x="885" y="395" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#071739" stroke-width="3"/><text x="980" y="445" font-size="25" font-weight="700" fill="#071739">Apresentação</text><text x="980" y="480" font-size="25" fill="#172033">do plano</text></g>
    <path d="M1075 455H1140" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/>
    <polygon points="1220,350 1325,455 1220,560 1115,455" fill="#E7EBEF" stroke="#4B6382" stroke-width="3"/><text x="1220" y="445" font-size="25" font-weight="700" fill="#071739">Algum credor</text><text x="1220" y="480" font-size="25" font-weight="700" fill="#071739">contestou?</text>
    <path d="M1325 455H1395" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="1360" y="430" font-size="23" font-weight="650" fill="#4B6382">Sim</text>
    <g filter="url(#s)"><rect x="1405" y="395" width="130" height="120" rx="18" fill="#4B6382"/><text x="1470" y="470" font-size="34" font-weight="700" fill="#FFFFFF">AGC</text></g>
    <path d="M1535 455H1590" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/>
    <polygon points="1660,365 1748,455 1660,545 1572,455" fill="#E7EBEF" stroke="#4B6382" stroke-width="3"/><text x="1660" y="465" font-size="25" font-weight="700" fill="#071739">Aprovou?</text>

    <path d="M1220 560V745H1490" fill="none" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="1260" y="625" font-size="23" font-weight="650" fill="#4B6382">Não</text>
    <path d="M1660 545V745H1545" fill="none" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="1695" y="625" font-size="23" font-weight="650" fill="#4B6382">Sim</text>
    <g filter="url(#s)"><rect x="1490" y="690" width="250" height="110" rx="18" fill="#A4B5C4" stroke="#071739" stroke-width="3"/><text x="1615" y="735" font-size="25" font-weight="700" fill="#071739">Homologa</text><text x="1615" y="770" font-size="25" fill="#071739">o plano</text></g>

    <path d="M1660 365V245" fill="none" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="1695" y="315" font-size="23" font-weight="650" fill="#4B6382">Não</text>
    <polygon points="1660,95 1748,185 1660,275 1572,185" fill="#E7EBEF" stroke="#4B6382" stroke-width="3"/><text x="1660" y="177" font-size="23" font-weight="700" fill="#071739">Juiz pode</text><text x="1660" y="208" font-size="23" font-weight="700" fill="#071739">aprovar?</text>
    <path d="M1572 185H1465" fill="none" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="1518" y="158" font-size="23" font-weight="650" fill="#4B6382">Sim</text>
    <g filter="url(#s)"><rect x="1240" y="130" width="225" height="110" rx="18" fill="#FFFFFF" stroke="#A68868" stroke-width="3"/><text x="1352" y="177" font-size="25" font-weight="700" fill="#071739">Cram down</text><text x="1352" y="210" font-size="21" fill="#172033">decisão judicial</text></g>
    <path d="M1660 95V55H1510" fill="none" stroke="#4B6382" stroke-width="5" marker-end="url(#a)"/><text x="1625" y="60" font-size="23" font-weight="650" fill="#4B6382">Não</text>
    <g filter="url(#s)"><rect x="1260" y="15" width="250" height="90" rx="18" fill="#071739"/><text x="1385" y="55" font-size="24" font-weight="700" fill="#FFFFFF">Decreta a falência</text><text x="1385" y="84" font-size="19" fill="#FFFFFF">decisão judicial</text></g>
  </g>
  <text x="900" y="905" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#4B6382">AJ: administrador judicial  ·  AGC: assembleia geral de credores</text>
</svg>
