project:
  type: book
  output-dir: docs

book:
  title: "JURIMETRIA: Dados, Métodos e Evidência para o Direito"
  author:
    - name: "Alexandre Nicolella"
      affiliation: "FEA-RP/USP"
    - name: "José de Jesus Filho"
      affiliation: "PUC-SP"
  page-navigation: true
  navbar:
    background: "#071739"
    logo: figuras/usp.png
    search: true
    right:
      - icon: github
        href: https://github.com/Jurimetria-USP/livro
        aria-label: GitHub
  sidebar:
    background: "#F8F5EF"
    search: true
    style: "docked"
    collapse-level: 1
  chapters:
    - index.qmd
    - autores.qmd
    - part: partes/01-fundamentos.qmd
      chapters:
        - capitulos/desenho-pesquisa-jurimetria.qmd
        - capitulos/selecao-disputas-litigio.qmd
        - capitulos/galanter.qmd
    - part: partes/02-ambiente-trabalho.qmd
      chapters:
        - capitulos/r-ambiente-trabalho.qmd
        - capitulos/projetos-reprodutiveis.qmd
        - capitulos/objetos-operacoes.qmd
        - capitulos/dataframes-importacao.qmd
        - capitulos/qualidade-dados.qmd
        - capitulos/operacoes-r-base.qmd
        - capitulos/universo-tidy.qmd
        - capitulos/manipulacao-dplyr.qmd
        - capitulos/dados-tidy-tidyr.qmd
        - capitulos/combinacao-bases.qmd
        - capitulos/textos-datas-categorias.qmd
        - capitulos/google-drive.qmd
    - part: "Parte III — Construção do banco de dados"
    - part: partes/04-descricao-fenomeno.qmd
      chapters:
        - capitulos/introducao-estatistica.qmd
        - capitulos/analise-descritiva.qmd
        - capitulos/analise-sobrevivencia.qmd
    - part: partes/05-explicacao-fenomeno.qmd
      chapters:
        - capitulos/modelos-lineares.qmd
        - capitulos/modelos-avancados.qmd

format:
  html:
    theme:
      - cosmo
      - tema-moderno.scss
    css: estilos.css
    toc: true
    toc-title: "Nesta página"
    fontsize: 16px

lang: pt-BR
editor: visual
