project:
  type: book
  output-dir: docs

book:
  title: "Livro de Jurimetria"
  subtitle: "Direito, Desigualdades e Ciência de Dados"
  author:
    - name: "Alexandre Nicolella"
      affiliation: "FEA-RP/USP"
    - name: "José de Jesus Filho"
      affiliation: "PUC-SP"
  page-navigation: true
  navbar:
    background: "#071739"
    logo: figuras/usp.png
    search: true
    left:
      - text: "Início"
        file: index.qmd
    right:
      - icon: github
        href: https://github.com/Jurimetria-USP/livro
        aria-label: GitHub
  sidebar:
    background: "#F8F5EF"
    search: true
    style: "docked"
    collapse-level: 1
  chapters:
    - index.qmd
    - autores.qmd
    - part: partes/01-fundamentos.qmd
    - part: partes/02-coleta.qmd
    - part: partes/03-extracao.qmd
    - part: partes/04-limpeza-estruturacao.qmd
    - part: partes/05-descricao.qmd
    - part: partes/06-explicacao.qmd

format:
  html:
    theme:
      - cosmo
      - tema-moderno.scss
    css: estilos.css
    toc: true
    toc-title: "Nesta página"
    fontsize: 16px

lang: pt-BR
editor: visual
