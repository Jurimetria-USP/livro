project:
  type: book
  output-dir: docs

book:
  title: "Livro de Jurimetria"
  subtitle: "Direito, Desigualdades e Ciência de Dados"
  author:
    - name: "Alexandre Nicolella"
      affiliation: "FEA-RP/USP"
    - name: "José de Jesus Filho"
      affiliation: "PUC-SP"
  page-navigation: true
  navbar:
    background: "#071739"
    logo: figuras/usp.png
    search: true
    left:
      - text: "Início"
        file: index.qmd
    right:
      - icon: github
        href: https://github.com/Jurimetria-USP/livro
        aria-label: GitHub
  sidebar:
    background: "#F8F5EF"
    search: true
    style: "docked"
    collapse-level: 1
  chapters:
    - index.qmd
    - autores.qmd
    - part: partes/01-fundamentos.qmd
      chapters:
        - capitulos/desenho-pesquisa-jurimetria.qmd
        - capitulos/selecao-disputas-litigio.qmd
        - capitulos/galanter.qmd
    - part: "Parte II — Ambiente de trabalho"
      chapters:
        - capitulos/manipulacao-dados.qmd
    - part: "Parte III — Coleta de processos e decisões"
    - part: "Parte IV — Extração da informação"
    - part: "Parte V — Limpeza e estruturação dos dados"
    - part: "Parte VI — Descrição do fenômeno"
    - part: "Parte VII — Explicação do fenômeno"

format:
  html:
    theme:
      - cosmo
      - tema-moderno.scss
    css: estilos.css
    toc: true
    toc-title: "Nesta página"
    fontsize: 16px

lang: pt-BR
editor: visual
