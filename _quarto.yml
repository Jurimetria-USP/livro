project:
  type: book
  output-dir: docs

book:
  title: "JURIMETRIA: Dados, Métodos e Evidência para o Direito"
  author:
    - name: "Alexandre Nicolella"
      affiliation: "FEA-RP/USP"
    - name: "José de Jesus Filho"
      affiliation: "PUC-SP"
  page-navigation: true
  navbar:
    background: "#071739"
    logo: figuras/usp.png
    search: true
    right:
      - icon: github
        href: https://github.com/Jurimetria-USP/livro
        aria-label: GitHub
  sidebar:
    background: "#F8F5EF"
    search: true
    style: "docked"
    collapse-level: 1
  chapters:
    - index.qmd
    - autores.qmd
    - part: partes/01-fundamentos.qmd
      chapters:
        - capitulos/P1C01-metodo-cientifico.qmd
        - capitulos/P1C02-pergunta-dados-evidencia.qmd
        - capitulos/P1C03-jurimetria-instrumento-pesquisa.qmd
        - capitulos/P1C04-litigios-desigualdades.qmd
    - part: partes/02-ambiente-trabalho.qmd
      chapters:
        - capitulos/P2C01-ambiente-computacional.qmd
        - capitulos/P2C02-r-python-linguagens.qmd
        - capitulos/P2C03-positron-quarto.qmd
        - capitulos/P2C04-git-github.qmd
        - capitulos/P2C05-agentes-projeto.qmd
        - capitulos/P2C06-exemplo-integrado-ecossistema.qmd
        - capitulos/P2C07-introducao-r.qmd
    - part: "Parte III — Construção do banco de dados"
    - part: partes/04-descricao-fenomeno.qmd
      chapters:
        - capitulos/P4C01-introducao-estatistica.qmd
        - capitulos/P4C02-analise-descritiva.qmd
        - capitulos/P4C03-analise-sobrevivencia.qmd
    - part: partes/05-explicacao-fenomeno.qmd
      chapters:
        - capitulos/P5C01-modelos-lineares.qmd
        - capitulos/P5C02-modelos-avancados.qmd

format:
  html:
    theme:
      - cosmo
      - tema-moderno.scss
    css: estilos.css
    toc: true
    toc-title: "Nesta página"
    fontsize: 16px

lang: pt-BR
editor: visual
